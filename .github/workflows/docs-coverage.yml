name: Documentation coverage and release intake

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:coverage
      - run: npm run check:coverage
      - name: Read reviewed source revision
        id: baseline
        run: node -e "const m=require('./docs/coverage.json'); if(!/^[a-f0-9]{40}$/.test(m.revision)) process.exit(1); console.log('revision='+m.revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: lcorneliussen/wtc-cli
          ref: ${{ steps.baseline.outputs.revision }}
          path: upstream
          persist-credentials: false
      - run: npm run check:coverage -- upstream

  upstream-review:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          repository: lcorneliussen/wtc-cli
          ref: main
          path: upstream
          persist-credentials: false
      - name: Prepare source and release review queue
        run: |
          npm run docs:propose -- upstream main docs-review.md
          printf '\nCompared upstream commit: ' >> docs-review.md
          git -C upstream rev-parse HEAD >> docs-review.md
          cat docs-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-review-queue
          path: docs-review.md
